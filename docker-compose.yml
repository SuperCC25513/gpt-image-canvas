services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.15.0-bookworm-slim}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
      DATA_DIR: /app/data
      PROMPT_POOL_DIR: ${PROMPT_POOL_DIR:-/app/prompt-pool-data}
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-DELETE}
      SQLITE_LOCKING_MODE: ${SQLITE_LOCKING_MODE:-EXCLUSIVE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GENERATION_QUEUE_DRIVER: ${GENERATION_QUEUE_DRIVER:-redis}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      GENERATION_PROVIDER_GLOBAL_CONCURRENCY: ${GENERATION_PROVIDER_GLOBAL_CONCURRENCY:-2}
      GENERATION_PROVIDER_PERMIT_TTL_MS: ${GENERATION_PROVIDER_PERMIT_TTL_MS:-1800000}
      GENERATION_QUEUE_WORKER_CONCURRENCY: ${GENERATION_QUEUE_WORKER_CONCURRENCY:-2}
      GENERATION_QUEUE_POLL_INTERVAL_MS: ${GENERATION_QUEUE_POLL_INTERVAL_MS:-250}
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    volumes:
      - ./data:/app/data
