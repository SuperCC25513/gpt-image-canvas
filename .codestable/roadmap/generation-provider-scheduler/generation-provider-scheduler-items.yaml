roadmap: generation-provider-scheduler
created: "2026-05-28"

items:
  - slug: redis-runtime-foundation
    description: 接入 Redis runtime、配置、健康检查和部署文档
    depends_on: []
    status: done
    feature: 2026-05-28-redis-runtime-foundation
    minimal_loop: false
    notes: "本地默认 redis://127.0.0.1:6379，无密码；Redis 成为生成调度的运行依赖"

  - slug: provider-global-semaphore
    description: 所有图片 provider 调用共用 Redis 全局并发闸门
    depends_on: [redis-runtime-foundation]
    status: done
    feature: 2026-05-28-provider-global-semaphore
    minimal_loop: true
    notes: "已通过 runProviderCall 限制整个应用同一时刻打到唯一 provider 的总请求数；并发值由 GENERATION_PROVIDER_GLOBAL_CONCURRENCY 配置"

  - slug: generation-queue-worker
    description: 手动生成任务进入 Redis 队列，由 worker 消费输出任务
    depends_on: [provider-global-semaphore]
    status: done
    feature: 2026-05-28-generation-queue-worker
    minimal_loop: false
    notes: "Redis 模式下手动生成已先创建 pending record 并入队，由 generation queue worker 消费；per-output job 与 retry 留给后续状态桥/重试 feature"

  - slug: provider-retry-policy
    description: 增加 provider 可恢复错误分类、退避重试和最终失败记录
    depends_on: [generation-queue-worker]
    status: done
    feature: 2026-05-29-provider-retry-policy
    minimal_loop: false
    notes: "已在单图 provider call 层增加 retry policy；每次 attempt 重新进入 runProviderCall，sleep 不占 permit；未实现 per-output delayed Redis job"

  - slug: agent-generation-scheduler-adapter
    description: Agent 生成 job 接入同一队列、闸门和重试机制
    depends_on: [provider-retry-policy]
    status: done
    feature: 2026-05-29-agent-generation-scheduler-adapter
    minimal_loop: false
    notes: "Redis/no provider override 下 Agent job 复用现有 generation queue 并等待 DB record 终态；inline/provider override 保留 direct path"

  - slug: generation-cancel-and-recovery
    description: 完善队列取消、重启恢复、失败收敛和退款幂等
    depends_on: [generation-queue-worker, provider-retry-policy]
    status: planned
    feature: null
    minimal_loop: false
    notes: null

  - slug: generation-queue-observability
    description: 暴露排队、运行、重试、失败摘要给 API、前端和审计
    depends_on: [generation-cancel-and-recovery, agent-generation-scheduler-adapter]
    status: planned
    feature: null
    minimal_loop: false
    notes: null
