    source: 挂载点
    status: passed

  - item: "createApp 启动阶段调用 Redis readiness"
    source: 挂载点
    status: passed

  - item: "GET /api/health 返回 Redis check 和 503 语义"
    source: 挂载点
    status: passed

  - item: "closeRedisClient 纳入 shutdown"
    source: 挂载点
    status: passed

